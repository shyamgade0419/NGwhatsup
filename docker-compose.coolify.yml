# NG WhatsApp Gateway on Coolify, built from THIS repository (not a public image), for NG Home's WhatsApp messages.
#
# In Coolify: + New -> Resource -> Private Repository (GitHub) -> pick this repo, branch main ->
#   Build Pack: Docker Compose, Base Directory: /, Docker Compose Location: /docker-compose.coolify.yml
# Then set the environment variable NG_WA_API_KEY (a long random secret, 40+ characters) and give the "ng-whatsapp"
# service the domain https://wa.yourdomain.in:2785
#
# One SQLite database inside the data volume is plenty for one WhatsApp number. The volume holds the WhatsApp link,
# so it survives redeploys: never delete it.

services:
  ng-whatsapp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Same container hardening as the upstream quick-start compose (docker-compose.dev.yml).
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 2048
    mem_limit: 2g
    expose:
      - '2785'
    volumes:
      - ng-whatsapp-data:/app/data
    environment:
      - NODE_ENV=development
      - TZ=Asia/Kolkata
      - PORT=2785
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - LOG_LEVEL=info
      # Bring the linked WhatsApp session back by itself after a restart or redeploy.
      - AUTO_START_SESSIONS=true
      - DATABASE_TYPE=sqlite
      - DATABASE_SYNCHRONIZE=true
      - SESSION_DATA_PATH=/app/data/sessions
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - PLUGINS_DIR=/app/data/plugins
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_ARGS=--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu
      # Gentle on a number that is new to automation: a daily allowance that grows as the session ages.
      - SEND_PACING_ENABLED=true
      # The admin key, fixed here so you know it (it is only read the first time the gateway starts).
      - API_MASTER_KEY=${NG_WA_API_KEY}
      # The API docs page is not needed on the public internet.
      - ENABLE_SWAGGER=false
      # Updates are chosen by you, not announced by the gateway.
      - UPDATE_CHECK_ENABLED=false

volumes:
  ng-whatsapp-data:
